<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtoBe Startups - Mentor Dashboard</title>
  <link rel="stylesheet" href="index.css">
</head>

<body style="min-height: 100vh;">

  <header class="dashboard-header">
    <a href="index.html" class="logo">AtoBe Startups</a>
    <div class="user-profile-nav">
      First name Last name <span class="avatar-icon"></span>
    </div>
  </header>

  <main style="max-width: 900px; margin: 0 auto; padding: 3rem 2rem;">

    <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Top Mentee Matches</h1>
    <p class="text-muted" id="matches-subtitle" style="margin-bottom: 2rem;">Loading your mentee matches...</p>

    <div id="matches-container"></div>

  </main>


  <script src="auth-shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('atobeToken');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      const container = document.getElementById('matches-container');
      const subtitle = document.getElementById('matches-subtitle');
      const title = document.querySelector('h1');

      try {
        const response = await fetch('/api/matches', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch requests');
        }

        const data = await response.json();

        if (data.length === 0) {
          title.textContent = "Your Dashboard";
          subtitle.textContent = "You are currently waiting on getting requests from mentees. When you get a request, it will appear here!";
          container.innerHTML = "";
          return;
        }

        container.innerHTML = "";

        // Check if there is a confirmed match
        const confirmedMatch = data.find(m => m.status === 'confirmed');
        if (confirmedMatch) {
          title.textContent = "Your Mentee Match";
          subtitle.textContent = "You have successfully matched! Please reach out to your mentee to schedule a meeting.";

          let helpAreasStr = "Mentorship";
          try {
            const helpAreas = JSON.parse(confirmedMatch.help_areas || '[]');
            if (helpAreas.length > 0) helpAreasStr = helpAreas.join(', ');
          } catch (e) { }

          const card = `
            <div style="border: 2px solid #10B981; border-radius: 12px; max-width: 650px; margin: 0 auto; box-shadow: 0 10px 25px rgba(16,185,129,0.1); padding: 3rem 2rem; text-align: center; background: white;">
              
              <div style="width: 64px; height: 64px; border-radius: 50%; background-color: #D1FAE5; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>

              <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: #10B981;">Mentee Matched!</h2>
              <p style="color: var(--text-muted); margin-bottom: 2.5rem;">You've accepted this mentee's request. Reach out to them to schedule your first meeting.</p>

              <div style="background-color: #F9FAFB; border-radius: 12px; padding: 2rem; text-align: left;">
                <h3 style="font-size: 1.25rem; margin-bottom: 0.25rem;">${confirmedMatch.startup_name || 'Anonymous Startup'}</h3>
                <span style="color: var(--text-muted); font-size: 0.875rem; display: block; margin-bottom: 1.5rem;">${confirmedMatch.current_stage || 'Unknown stage'}</span>
                
                <div class="match-info-section">
                  <div class="match-info-label">Founders</div>
                  <div class="match-info-value" style="font-weight: 500;">${confirmedMatch.founders || 'N/A'}</div>
                </div>
                <div class="match-info-section">
                  <div class="match-info-label">Contact Email</div>
                  <div class="match-info-value" style="font-weight: 500;">${confirmedMatch.email || 'N/A'}</div>
                </div>
                <div class="match-info-section">
                  <div class="match-info-label">Looking For Help With</div>
                  <div class="match-info-value" style="font-weight: 500;">${helpAreasStr}</div>
                </div>
                <a href="mentee-details.html?id=${confirmedMatch.id}" class="btn btn-outline" style="margin-top: 1.5rem; display: inline-block;">View Full Application</a>
              </div>
            </div>
          `;
          container.innerHTML = card;
          return;
        }

        // Otherwise, these are pending requests
        title.textContent = "Pending Mentee Requests";
        subtitle.textContent = `You have ${data.length} pending request(s) waiting for your review.`;

        data.forEach(req => {
          let helpAreasStr = "Mentorship";
          try {
            const helpAreas = JSON.parse(req.help_areas || '[]');
            if (helpAreas.length > 0) helpAreasStr = helpAreas.join(', ');
          } catch (e) { }

          const card = `
              <div class="request-card" style="position: relative; margin-bottom: 2rem;">
                <div class="badge-new" style="position: relative; right: auto; top: auto; display: inline-block; margin-bottom: 1rem; background-color: var(--primary-blue); color: white;">Pending your approval</div>

                <div class="match-header"
                  style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
                  <div class="match-avatar" style="width: 56px; height: 56px; background-color: var(--primary-blue); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: bold;">${(req.startup_name || 'A')[0].toUpperCase()}</div>
                  <div>
                    <h2 style="font-size: 1.125rem; margin-bottom: 0;">${req.startup_name || 'Anonymous Startup'}</h2>
                    <span class="text-muted" style="font-size: 0.875rem;">${req.founders || 'Founders Name'} • ${req.current_stage || ''}</span>
                  </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
                  <div style="grid-column: span 2;">
                    <div class="match-info-label">Looking For Help With</div>
                    <div class="match-info-value">${helpAreasStr}</div>
                  </div>
                  <div style="grid-column: span 2;">
                    <div class="match-info-label">Main Decision / Challenge</div>
                    <div class="match-info-value">${req.main_decision || 'N/A'}</div>
                  </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                  <button class="btn btn-success" style="flex: 2;" onclick="respondToRequest(${req.match_id}, 'accept', this)">✓ Accept Request</button>
                  <button class="btn btn-outline" style="flex: 1; border-color: red; color: red;" onclick="respondToRequest(${req.match_id}, 'decline', this)">Decline</button>
                  <a href="mentee-details.html?id=${req.id}" class="btn btn-outline" style="flex: 1;">More Info</a>
                </div>
              </div>
            `;
          container.innerHTML += card;
        });

      } catch (err) {
        console.error(err);
        subtitle.textContent = "An error occurred while loading your matches.";
      }
    });

    async function respondToRequest(matchId, action, buttonEl) {
      if (buttonEl.disabled) return;
      buttonEl.disabled = true;
      const originalText = buttonEl.textContent;
      buttonEl.textContent = "...";

      const token = localStorage.getItem('atobeToken');
      try {
        const route = action === 'accept' ? '/api/matches/accept' : '/api/matches/decline';
        const res = await fetch(route, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ match_id: matchId })
        });

        if (!res.ok) {
          throw new Error('Failed to ' + action + ' request');
        }

        window.location.reload();
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
        buttonEl.disabled = false;
        buttonEl.textContent = originalText;
      }
    }
  </script>
</body>
